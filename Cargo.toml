[package]
name = "giftwrap"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "giftwrap v2 sandbox runner"

[dependencies]
clap = { version = "4.5.30", features = ["derive"] }
fs4 = "0.12.0"
hex = "0.4.3"
nix = { version = "0.29.0", features = ["signal", "process", "user"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
sha2 = "0.10.8"
signal-hook = "0.3.17"
thiserror = "2.0.11"
toml = "0.8.20"
which = "7.0.2"

[dev-dependencies]
tempfile = "3.17.1"

[profile.release]
lto = true
codegen-units = 1
